<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abel-John Buchner</title>
  <meta name="description" content="Abel-John Buchner, Assistant Professor, Mechanical Engineering, Delft University of Technology">
  <style>
    :root {
      --tud-cyan: #00A6D6;      /* TU Delft blue */
      --pale: #E5F6FB;          /* pale tint of TU Delft blue */
      --ink: #0C2340;           /* TU Delft dark blue, for text */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--pale);
      color: var(--ink);
      font-family: "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      max-width: 560px;
      width: 100%;
      border-left: 4px solid var(--tud-cyan);
      padding: 8px 0 8px 28px;
    }
    h1 {
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }
    .title {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    ul { list-style: none; }
    li { margin: 6px 0; font-size: 1rem; }
    a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 2px solid var(--tud-cyan);
    }
    a:hover, a:focus { color: var(--tud-cyan); }
  </style>
</head>
<body>
  <main>
    <h1>Abel-John Buchner</h1>
    <p class="title">
      Assistant Professor, Mechanical Engineering<br>
      Delft University of Technology
    </p>
    <ul>
      <li><a href="mailto:a.j.buchner@tudelft.nl">a.j.buchner@tudelft.nl</a></li>
      <!-- Replace this href with your profile URL, e.g. https://scholar.google.com/citations?user=YOUR_ID -->
      <li><a href="https://scholar.google.com/citations?hl=nl&user=SpUDYeEAAAAJ">Google Scholar</a></li>
    </ul>
  </main>
</body>
</html>
